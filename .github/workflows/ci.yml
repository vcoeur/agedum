name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # hatch-vcs needs history + tags to derive the version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install (with dev group)
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
