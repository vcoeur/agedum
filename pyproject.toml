[project]
name = "agedum"
dynamic = ["version"]
description = "Drive any agent CLI from an agent-neutral source shape (AGENTS.md + .agents/skills), translating per harness at launch."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alice Voland" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.9",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/vcoeur/agedum"
Issues = "https://github.com/vcoeur/agedum/issues"

[project.scripts]
agedum = "agedum.cli.main:app"

[build-system]
# Pinned: uv.lock does not lock build backends, so an unpinned hatchling resolves to
# whatever is newest at build time. hatchling 1.32.0 emits Metadata-Version 2.5, which
# older pypa/gh-action-pypi-publish validators reject — the same source tree then fails
# at publish with every other release gate green (nodum v0.18.0, 2026-08-14).
requires = ["hatchling==1.31.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

# Version is derived from the git tag (vX.Y.Z) at build time — never committed.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["agedum"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105", "SIM117"]
